<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Routine Analyzer</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <a href="./index.html" class="back-link">← Back to Home</a>
        <div class="logo">Routine Analyzer</div>
        <h2 id="auth-title">Welcome Back</h2>
        <p class="auth-subtitle" id="auth-subtitle">Analyze your day with AI Coach.</p>

        <form id="auth-form" class="auth-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required class="text-input">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required class="text-input">
            </div>
            <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%; margin-bottom: 20px;">Log In</button>
        </form>

        <div style="text-align: center; color: #ADB5BD; font-size: 0.9rem; margin-bottom: 20px;">OR</div>

        <div style="text-align: center;">
            <button type="button" id="google-btn" class="btn-secondary" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" alt="Google">
                Sign in with Google
            </button>
        </div>

        <p class="auth-switch" style="margin-top: 25px;">
            <span id="switch-text">Don't have an account?</span> 
            <span id="toggle-mode" style="color: var(--accent-color); font-weight: bold; cursor: pointer;">Sign Up</span>
        </p>
    </div>

    <script type="module">
        import { auth, provider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from './js/firebase-config.js';

        const authForm = document.getElementById('auth-form');
        const googleBtn = document.getElementById('google-btn');
        const toggleMode = document.getElementById('toggle-mode');
        const authTitle = document.getElementById('auth-title');
        const submitBtn = document.getElementById('submit-btn');
        let isSignUp = false;

        toggleMode.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.innerText = isSignUp ? "Create Account" : "Welcome Back";
            submitBtn.innerText = isSignUp ? "Sign Up" : "Log In";
            toggleMode.innerText = isSignUp ? "Log In" : "Sign Up";
            document.getElementById('switch-text').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = './index.html'; // [Modified] 상대 경로로 수정
                }
            } catch (error) {
                alert("Auth Error: " + error.message); // [Modified] 범용 에러 메시지
            }
        });

        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = './index.html'; // [Modified] 상대 경로로 수정
            } catch (error) {
                // [Modified] 로컬 호스트 관련 경고 alert 삭제
                console.error("Google Auth Error:", error.code);
                alert("Login Failed. Error: " + error.code); 
            }
        });
    </script>
</body>
</html>
